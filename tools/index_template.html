<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="https://fast-pay-store.github.io/digital-world/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="https://fast-pay-store.github.io/digital-world/assets/favicon-120.png" sizes="120x120" type="image/png">
<link rel="apple-touch-icon" href="https://fast-pay-store.github.io/digital-world/assets/apple-touch-icon.png">

<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{BASE}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{BASE}}">
<meta property="og:locale" content="ru_RU">
<link rel="sitemap" type="application/xml" href="sitemap.xml">
<script type="application/ld+json">
{{JSONLD}}
</script>
<!-- Файл создаётся автоматически (tools/build_site.py). Правки вносите в tools/index_template.html или site.json. -->
<style>
  :root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#4b5563;--line:#e3e6ec;--accent:#1d4ed8;--hero:#0f1a33}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1222;--card:#141c2f;--ink:#eef2fb;--muted:#a7b3c9;--line:#25304a;--accent:#7aa2ff;--hero:#060c1a}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Roboto,Arial,sans-serif}
  header{background:var(--hero);color:#fff;padding:56px 20px 48px}
  .wrap{max-width:1100px;margin:0 auto}
  header h1{margin:0 0 10px;font-size:clamp(30px,5vw,46px);letter-spacing:-.01em}
  header p{margin:0;color:#c9d4ea;font-size:18px;max-width:680px}
  .count{display:inline-block;margin-top:18px;font-size:13px;color:#bcd0ff;border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:4px 12px}
  main{padding:32px 20px 56px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.08);border-color:var(--accent)}
  .card h2{margin:0 0 8px;font-size:18px;line-height:1.3}
  .card p{margin:0 0 16px;color:var(--muted);font-size:15px;flex:1}
  .go{margin-top:auto;color:var(--accent);font-weight:600;font-size:15px}
  footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--muted);font-size:14.5px}
  footer a{color:var(--accent)}
</style>
</head>
<body>
  <header><div class="wrap">
    <h1>{{HEADING}}</h1>
    <p>{{DESCRIPTION}}</p>
    <span class="count">Страниц на сайте: {{COUNT}}</span>
  </div></header>
  <main><div class="wrap">
    <div class="grid">
      {{CARDS}}
    </div>
  </div></main>
  <footer>Вопросы и доступ: <a href="{{CONTACT_URL}}" target="_blank" rel="noopener">{{CONTACT_TEXT}}</a></footer>
</body>
</html>
