name: Отчёт Яндекс.Вебмастера (→ Telegram)

# По понедельникам в 10:47 МСК и вручную: ИКС, страницы в поиске, проблемы и топ запросов за неделю.
# Нужен секрет YANDEX_WEBMASTER_TOKEN.
on:
  schedule:
    - cron: '47 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка связи с API Вебмастера
        continue-on-error: true
        run: |
          curl -4 -sS -m 25 -o /dev/null -w "IPv4: %{http_code}\n" https://api.webmaster.yandex.net/v4/user || true
          curl -6 -sS -m 25 -o /dev/null -w "IPv6: %{http_code}\n" https://api.webmaster.yandex.net/v4/user || true
          curl -sS -m 25 -o /dev/null -w "yandex.ru: %{http_code}\n" https://yandex.ru || true
      - name: Отчёт
        env:
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 tools/webmaster_report.py
