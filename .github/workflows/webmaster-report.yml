name: Отчёт Яндекс.Вебмастера (только вручную — см. описание)

# ВНИМАНИЕ: API Вебмастера (api.webmaster.yandex.net) не принимает соединения с серверов GitHub
# (проверено 21.10.2026). Еженедельный отчёт запускается на компьютере владельца:
# D:\GD\AI_clod\Сайт digital-world\Отчёт Вебмастера (Планировщик Windows, понедельник 11:17).
# Этот workflow оставлен для ручной проверки — вдруг доступ откроют.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Отчёт
        env:
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 tools/webmaster_report.py
