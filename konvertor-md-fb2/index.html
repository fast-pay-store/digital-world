<body>
<main>
  <h1>Markdown → FB2</h1>
  <p class="sub">Конвертация происходит прямо в браузере — файлы никуда не отправляются.</p>

  <div id="drop">
    Перетащите сюда .md файл (или несколько) — или нажмите, чтобы выбрать
    <small>Если в тексте есть картинки из файлов — перетащите их сюда же, вместе с .md</small>
  </div>
  <input type="file" id="file" multiple hidden accept=".md,.markdown,.mdown,.txt,image/*">
  <ul id="loaded"></ul>

  <textarea id="text" placeholder="…или вставьте Markdown-текст сюда"></textarea>

  <div class="row">
    <label>Название книги (если пусто — возьмём первый заголовок)
      <input id="title" type="text"></label>
    <label>Автор (Имя Фамилия)
      <input id="author" type="text"></label>
    <label>Язык
      <select id="lang">
        <option value="ru">Русский</option>
        <option value="en">English</option>
        <option value="uk">Українська</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
      </select></label>
    <label>Жанр
      <select id="genre">
        <option value="nonfiction">Документальная литература</option>
        <option value="prose_contemporary">Современная проза</option>
        <option value="sf">Фантастика</option>
        <option value="computers">Компьютеры</option>
      </select></label>
  </div>

  <div class="btns">
    <button id="go">Конвертировать</button>
    <button id="clear" class="alt">Очистить</button>
  </div>
  <div id="status"></div>
  <div id="results"></div>
  <footer>Разбор Markdown: библиотека marked. Формат: FictionBook 2.0.</footer>
